<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trucks — TruckQonnect Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/animations.css" rel="stylesheet">
</head>
<body class="tq-admin-shell" data-page-title="Trucks">
  <div class="tq-sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="tq-sidebar" id="tqSidebar"></aside>
  <div class="tq-main">
    <header class="tq-topbar" id="tqTopbar"></header>
    <div class="tq-content">
      <div class="tq-page-header tq-animate-in">
        <h1 class="tq-page-title">Trucks</h1>
        <p class="tq-page-sub">Fleet registry and capacity management</p>
      </div>
      <div class="row g-3" id="trucksGrid"></div>
      <div class="modal fade" id="truckModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Truck details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><img src="https://images.unsplash.com/photo-1601584115929-48c62445b8f6?w=400" class="img-fluid rounded mb-3" alt=""><p>ABC 1234 ZW · Volvo flatbed · 15 Ton</p></div></div></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/tables.js"></script>
  
</body>
</html>
  <script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('trucksGrid').innerHTML=TQMock.trucks.map(t=>'<div class="col-md-6"><div class="tq-card p-3 tq-card-hover"><div class="d-flex justify-content-between"><strong>'+t.plate+'</strong>'+TQTables.statusBadge(t.status)+'</div><div class="small text-secondary">'+t.brand+' · '+t.type+' · '+t.capacity+'</div><div class="small mt-2">Driver: '+t.driver+'</div><button class="btn btn-sm btn-outline-secondary mt-2" data-bs-toggle="modal" data-bs-target="#truckModal">Details</button></div></div>').join('');});</script>
