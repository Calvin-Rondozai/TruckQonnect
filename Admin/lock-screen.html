<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locked — TruckQonnect Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/animations.css" rel="stylesheet">
</head>
<body class="tq-auth-body">
  <div class="tq-auth-panel" style="min-height:100vh;background:linear-gradient(160deg,#0f0f10,#1e1e1e)">
    <div class="tq-auth-card tq-animate-in text-center">
      <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=120&h=120&fit=crop" alt="" class="rounded-circle mb-3" width="88" height="88" style="border:3px solid var(--tq-yellow)">
      <h2 class="h5 mb-1">Calvin Admin</h2>
      <p class="text-secondary small mb-4">Session locked · May 20, 2026</p>
      <form id="unlockForm" class="text-start">
        <div class="mb-3">
          <div class="tq-input-wrap">
            <i class="bi bi-lock"></i>
            <input class="tq-input" type="password" placeholder="Password" required>
          </div>
        </div>
        <button type="submit" class="tq-btn-primary">Unlock</button>
      </form>
      <a href="login.html" class="small d-inline-block mt-3">Sign in as different user</a>
    </div>
  </div>
  <script src="assets/js/auth.js"></script>
</body>
</html>
