<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — TruckQonnect Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/animations.css" rel="stylesheet">
</head>
<body class="tq-login-page">
  <main class="tq-login-card tq-animate-in">
    <div class="tq-login-brand">
      <img
        src="assets/images/logo.png.png"
        alt="TruckQonnect"
        class="tq-login-logo"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"
      >
      <div class="tq-login-wordmark" style="display:none">Truck<span>Q</span>onnect</div>
    </div>

    <h1 class="tq-login-title">Sign in to your account</h1>
    <p class="tq-login-sub">TruckQonnect administration portal</p>

    <form id="loginForm" class="tq-login-form" novalidate>
      <div class="tq-login-field">
        <label class="tq-login-label" for="email">Your email</label>
        <input
          class="tq-login-input"
          type="email"
          id="email"
          name="email"
          placeholder="admin@truckqonnect.co.zw"
          autocomplete="email"
          required
          value="admin@truckqonnect.co.zw"
        >
      </div>

      <div class="tq-login-field">
        <label class="tq-login-label" for="password">Password</label>
        <div class="tq-login-input-wrap">
          <input
            class="tq-login-input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
            value="admin2026"
          >
          <button
            type="button"
            class="tq-login-eye"
            data-toggle-password="#password"
            aria-label="Show password"
          >
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="tq-login-row">
        <label class="tq-login-check">
          <input type="checkbox" name="remember" checked>
          <span>Remember me</span>
        </label>
        <a href="forgot-password.html" class="tq-login-link">Forgot password?</a>
      </div>

      <button type="submit" class="tq-login-btn">Sign in</button>
    </form>

    <p class="tq-login-footer">
      Need help? <a href="support-center.html" class="tq-login-link-underline">Contact support</a>
    </p>
  </main>

  <script src="assets/js/auth.js"></script>
</body>
</html>
