<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trips — TruckQonnect Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/animations.css" rel="stylesheet">
</head>
<body class="tq-admin-shell" data-page-title="Trips">
  <div class="tq-sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="tq-sidebar" id="tqSidebar"></aside>
  <div class="tq-main">
    <header class="tq-topbar" id="tqTopbar"></header>
    <div class="tq-content">
      <div class="tq-page-header tq-animate-in">
        <h1 class="tq-page-title">Trips</h1>
        <p class="tq-page-sub">Active deliveries, ETAs, and trip timelines</p>
      </div>
      <div class="row g-3" id="tripsGrid"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/tables.js"></script>
  
</body>
</html>
  <script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('tripsGrid').innerHTML=TQMock.trips.map(t=>'<div class="col-lg-6"><div class="tq-card p-3"><div class="d-flex justify-content-between mb-2"><strong>'+t.id+'</strong>'+TQTables.statusBadge(t.status)+'</div><div class="text-secondary small">'+t.driver+' · '+t.route+'</div><div class="mt-3"><div class="d-flex justify-content-between small mb-1"><span>Progress</span><span>ETA '+t.eta+'</span></div><div class="progress" style="height:8px"><div class="progress-bar bg-warning" style="width:'+t.progress+'%"></div></div></div><div class="tq-timeline mt-3"><div class="tq-timeline-step done"><span class="small">En route to pickup</span></div><div class="tq-timeline-step done"><span class="small">In transit</span></div><div class="tq-timeline-step"><span class="small">Delivered</span></div></div><div class="tq-map-placeholder mt-3" style="min-height:100px;font-size:.8rem"><i class="bi bi-signpost-split"></i> Route preview</div></div></div>').join('');});</script>
