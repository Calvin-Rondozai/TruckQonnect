<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verification Center — TruckQonnect Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/animations.css" rel="stylesheet">
</head>
<body class="tq-admin-shell" data-page-title="Verification Center">
  <div class="tq-sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="tq-sidebar" id="tqSidebar"></aside>
  <div class="tq-main">
    <header class="tq-topbar" id="tqTopbar"></header>
    <div class="tq-content">
      <div class="tq-page-header tq-animate-in">
        <h1 class="tq-page-title">Verification Center</h1>
        <p class="tq-page-sub">Document review and approval queue</p>
      </div>
      <div class="row g-3" id="verifyGrid"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/tables.js"></script>
  
</body>
</html>
  <script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('verifyGrid').innerHTML=TQMock.verifications.map(v=>'<div class="col-md-6"><div class="tq-card p-3"><div class="fw-bold">'+v.name+'</div><div class="small text-secondary">'+v.doc+' · '+v.submitted+'</div><div class="mt-2">'+TQTables.statusBadge(v.status)+'</div><div class="d-flex gap-2 mt-3"><button class="btn btn-sm btn-success">Approve</button><button class="btn btn-sm btn-outline-danger">Reject</button><button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#docModal">Preview</button></div></div></div>').join('');});</script>
