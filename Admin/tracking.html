<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking — TruckQonnect Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/animations.css" rel="stylesheet">
</head>
<body class="tq-admin-shell" data-page-title="Tracking">
  <div class="tq-sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="tq-sidebar" id="tqSidebar"></aside>
  <div class="tq-main">
    <header class="tq-topbar" id="tqTopbar"></header>
    <div class="tq-content">
      <div class="tq-page-header tq-animate-in">
        <h1 class="tq-page-title">Tracking</h1>
        <p class="tq-page-sub">Live fleet positions and delivery monitoring</p>
      </div>
      <div class="tq-card mb-3"><div class="tq-map-placeholder" style="min-height:420px"><i class="bi bi-geo-alt-fill fs-1 text-warning"></i><span>Live logistics map</span><small class="text-secondary">89 trucks reporting · Harare · Bulawayo · Mutare corridors</small></div></div>
      <div class="row g-3" id="truckCards"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/tables.js"></script>
  
</body>
</html>
  <script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('truckCards').innerHTML=TQMock.trips.map(t=>'<div class="col-md-6"><div class="tq-card p-3 d-flex gap-3 align-items-center"><div class="tq-kpi-icon"><i class="bi bi-truck"></i></div><div><div class="fw-semibold">'+t.driver+'</div><div class="small text-secondary">'+t.route+' · '+t.eta+'</div>'+TQTables.statusBadge(t.status)+'</div></div></div>').join('');});</script>
