<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fraud Monitoring — TruckQonnect Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/animations.css" rel="stylesheet">
</head>
<body class="tq-admin-shell" data-page-title="Fraud Monitoring">
  <div class="tq-sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="tq-sidebar" id="tqSidebar"></aside>
  <div class="tq-main">
    <header class="tq-topbar" id="tqTopbar"></header>
    <div class="tq-content">
      <div class="tq-page-header tq-animate-in">
        <h1 class="tq-page-title">Fraud Monitoring</h1>
        <p class="tq-page-sub">Risk signals and suspicious activity</p>
      </div>
      <div class="alert border-warning bg-warning bg-opacity-10 text-warning mb-4"><i class="bi bi-exclamation-triangle-fill me-2"></i>2 high-risk alerts require review</div>
      <div class="tq-card"><div class="tq-table-wrap"><table class="tq-table"><thead><tr><th>ID</th><th>User</th><th>Risk</th><th>Reason</th><th>Time</th></tr></thead><tbody id="fraudBody"></tbody></table></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/tables.js"></script>
  
</body>
</html>
  <script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('fraudBody').innerHTML=TQMock.fraudAlerts.map(f=>'<tr><td><code>'+f.id+'</code></td><td>'+f.user+'</td><td>'+TQTables.statusBadge(f.risk.toLowerCase())+'</td><td>'+f.reason+'</td><td>'+f.time+'</td></tr>').join('');});</script>
