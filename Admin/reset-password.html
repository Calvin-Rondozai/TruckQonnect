<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — TruckQonnect Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/animations.css" rel="stylesheet">
</head>
<body class="tq-auth-body">
  <div class="tq-auth-panel" style="min-height:100vh">
    <div class="tq-auth-card tq-animate-in">
      <h2 class="tq-brand-text mb-2">Create new password</h2>
      <p class="text-secondary small mb-4">Must be at least 10 characters with mixed case and numbers.</p>
      <form id="resetForm">
        <div class="mb-3">
          <label class="tq-form-label">New password</label>
          <div class="tq-input-wrap">
            <i class="bi bi-lock"></i>
            <input class="tq-input" type="password" id="newPass" required>
            <button type="button" class="tq-input-toggle" data-toggle-password="#newPass"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="mb-4">
          <label class="tq-form-label">Confirm password</label>
          <div class="tq-input-wrap">
            <i class="bi bi-lock-fill"></i>
            <input class="tq-input" type="password" id="confirmPass" required>
          </div>
        </div>
        <button type="submit" class="tq-btn-primary">Update password</button>
      </form>
    </div>
  </div>
  <script src="assets/js/auth.js"></script>
</body>
</html>
