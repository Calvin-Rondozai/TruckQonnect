<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password — TruckQonnect Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/animations.css" rel="stylesheet">
</head>
<body class="tq-auth-body">
  <div class="tq-auth-panel" style="min-height:100vh">
    <div class="tq-auth-card tq-animate-in">
      <a href="login.html" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left"></i> Back to sign in</a>
      <h2 class="tq-brand-text mt-3 mb-2">Reset password</h2>
      <p class="text-secondary small mb-4">We'll send a secure link to your registered email.</p>
      <form id="forgotForm">
        <div class="mb-4">
          <label class="tq-form-label" for="email">Email address</label>
          <div class="tq-input-wrap">
            <i class="bi bi-envelope"></i>
            <input class="tq-input" type="email" id="email" required placeholder="admin@truckqonnect.co.zw">
          </div>
        </div>
        <button type="submit" class="tq-btn-primary">Send reset link</button>
      </form>
    </div>
  </div>
  <script src="assets/js/auth.js"></script>
</body>
</html>
